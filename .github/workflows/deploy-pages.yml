name: Deploy to GitHub Pages

on:
  push:
    branches: [vertical/womens-health]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      # Same workflow runs in every repo. The single-feature validation repos
      # are named sakhi-<feature> (sakhi-health | sakhi-period | sakhi-mood);
      # the combined site lives in sakhi-prototype and uses an empty feature.
      - name: Derive feature from repo name
        id: feat
        run: |
          repo="${GITHUB_REPOSITORY##*/}"
          feature="${repo#sakhi-}"
          if [ "$feature" = "prototype" ]; then feature=""; fi
          echo "feature=$feature" >> "$GITHUB_OUTPUT"

      - name: Build
        working-directory: apps/shell
        env:
          NEXT_PUBLIC_GROQ_API_KEY: ${{ secrets.NEXT_PUBLIC_GROQ_API_KEY }}
          GITHUB_PAGES: "true"
          SAKHI_FEATURE: ${{ steps.feat.outputs.feature }}
        run: npm run build

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/shell/out

      # First attempt — non-fatal so a transient Pages backend error
      # ("Deployment failed, try again later.") doesn't fail the whole run.
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
        with:
          timeout: 600000
          error_count: 10
          reporting_interval: 5000

      # Retry only if the first attempt hit a transient failure.
      - id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000
          error_count: 10
          reporting_interval: 5000
